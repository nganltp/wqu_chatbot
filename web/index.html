<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WQU Support Chatbot</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f4f6fb; }
      body { margin: 0; }
      main { max-width: 760px; min-height: 100vh; margin: auto; padding: 32px 18px; box-sizing: border-box; }
      h1 { margin: 0; font-size: 1.7rem; } p { color: #5d687c; line-height: 1.5; }
      .chat-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; } .chat-header p { margin: 8px 0 0; }
      #chat { display: grid; gap: 14px; margin: 28px 0; }
      .message { padding: 14px 16px; border-radius: 12px; background: white; box-shadow: 0 1px 4px #17203312; white-space: pre-wrap; line-height: 1.5; }
      .markdown > :first-child { margin-top: 0; } .markdown > :last-child { margin-bottom: 0; } .markdown p, .markdown ul, .markdown ol { margin: 0 0 12px; } .markdown li + li { margin-top: 4px; } .markdown code { padding: 1px 4px; border-radius: 4px; background: #edf1f8; } .markdown pre { overflow-x: auto; padding: 12px; border-radius: 8px; background: #172033; color: #f4f6fb; } .markdown pre code { padding: 0; background: transparent; color: inherit; }
      .user { background: #e5edff; margin-left: 48px; } .assistant { margin-right: 24px; }
      .sources { margin: 10px 0 0; padding-left: 20px; font-size: .9rem; } .sources a { color: #2458c6; }
      .sample-questions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; } .sample-questions[hidden] { display: none; } .sample-question { padding: 8px 10px; border: 1px solid #c9d2e3; background: white; color: #2458c6; font-size: .9rem; }
      form { display: flex; gap: 10px; position: sticky; bottom: 10px; padding: 10px; border-radius: 14px; background: #fff; box-shadow: 0 4px 24px #1720331c; }
      input { flex: 1; min-width: 0; border: 1px solid #c9d2e3; border-radius: 9px; padding: 12px; font: inherit; }
      button { border: 0; border-radius: 9px; padding: 12px 16px; background: #1e54c5; color: white; font: inherit; cursor: pointer; }
      .secondary { align-self: flex-end; background: #e5edff; color: #1e54c5; white-space: nowrap; }
      button:disabled { opacity: .6; cursor: wait; } .error { color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <div class="chat-header">
        <div>
          <h1>WQU Support Chatbot</h1>
          <p>Ask a question about WQU procedures. Answers include links to the official source.</p>
        </div>
        <button id="clear-chat" class="secondary" type="button">New chat</button>
      </div>
      <section id="chat" aria-live="polite"></section>
      <div class="sample-questions" aria-label="Sample questions">
        <button class="sample-question" type="button" data-question="How can I contact WQU student support?">How can I contact student support?</button>
        <button class="sample-question" type="button" data-question="How can I update or correct my name on my WQU student profile?">How can I update my name?</button>
      </div>
      <form id="chat-form">
        <input id="question" placeholder="Ask a WQU support question" autocomplete="off" required />
        <button id="send" type="submit">Send</button>
      </form>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
